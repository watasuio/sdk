name: Release SDKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to release, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  release:
    name: Release SDK packages
    runs-on: ubuntu-latest
    environment: release
    env:
      SDK_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate dispatch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Release workflow must run from main, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if ! printf '%s' "$SDK_RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Version must look like v1.0.0" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse duplicate version tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$SDK_RELEASE_VERSION" >/dev/null; then
            echo "Tag already exists: $SDK_RELEASE_VERSION" >&2
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt

      - name: Verify registry authentication before preparing a release
        run: |
          node --test scripts/check-publish-auth.test.mjs
          node scripts/check-publish-auth.mjs

      - name: Prepare version bump
        run: node scripts/prepare-release.mjs "$SDK_RELEASE_VERSION"

      - name: Install Python build tools
        run: python -m pip install --upgrade "build>=1.6.1" -e ".[test]" -e python-code-interpreter

      - name: Test Python SDK
        run: |
          python -m pytest -q
          python -m compileall -q python python-code-interpreter/src tests

      - name: Test TypeScript SDK
        working-directory: ts
        run: |
          npm ci
          npm test

      - name: Test TypeScript Code Interpreter SDK
        working-directory: ts-code-interpreter
        run: |
          npm install --no-package-lock --no-save ../ts
          npm test

      - name: Test Rust SDK
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo test
          cargo check --no-default-features
          cargo check --no-default-features --features native-tls
          cargo check --no-default-features --features rustls-tls-native-roots
          cargo doc --no-deps
          # Version preparation mutates Cargo.toml and Cargo.lock before the
          # workflow commits the release bump.
          cargo publish --dry-run --allow-dirty

      - name: Commit release bump and tag
        run: |
          set -euo pipefail
          git config user.name 'watasu.io'
          git config user.email 'watasu@watasu.io'
          git add pyproject.toml python-code-interpreter/pyproject.toml rust/Cargo.toml rust/Cargo.lock ts/package.json ts/package-lock.json ts-code-interpreter/package.json
          git commit -m "chore(release): $SDK_RELEASE_VERSION"
          git tag -a "$SDK_RELEASE_VERSION" -m "$SDK_RELEASE_VERSION"
          git push origin HEAD:main
          git push origin "$SDK_RELEASE_VERSION"

      - name: Build Python package
        run: |
          python -m build
          python -m build python-code-interpreter --outdir dist

      - name: Publish Python package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Publish TypeScript package
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish TypeScript Code Interpreter package
        working-directory: ts-code-interpreter
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Authenticate crates.io trusted publisher
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        continue-on-error: true

      - name: Publish Rust package with trusted publisher
        if: steps.crates_auth.outcome == 'success'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: cargo publish

      - name: Publish Rust package with fallback token
        if: steps.crates_auth.outcome != 'success'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "Configure crates.io trusted publishing or set CARGO_REGISTRY_TOKEN." >&2
            exit 1
          fi
          cargo publish
