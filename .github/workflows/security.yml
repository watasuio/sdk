name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security/bin"
          cd "$RUNNER_TEMP/security"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' 'gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          curl --fail --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz --output trivy.tar.gz
          printf '%s  %s\n' 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f' 'trivy.tar.gz' | sha256sum --check
          tar -xzf trivy.tar.gz -C bin trivy
          echo "$RUNNER_TEMP/security/bin" >> "$GITHUB_PATH"
      - name: Scan reachable Git history with reviewed base-branch findings
        shell: bash
        env:
          SECURITY_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          git show "$SECURITY_BASE_REVISION:.github/security/gitleaks-fingerprints.txt" > "$RUNNER_TEMP/security/reviewed.gitleaksignore"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/security/gitleaks.toml"
          gitleaks git . --redact=100 --no-banner --log-opts=--all \
            --config "$RUNNER_TEMP/security/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/security/reviewed.gitleaksignore" \
            --ignore-gitleaks-allow \
            --report-format json --report-path "$RUNNER_TEMP/security/secrets.json"
      - name: Scan resolved source dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf '{}\n' > "$RUNNER_TEMP/security/trivy.yaml"
          touch "$RUNNER_TEMP/security/empty.trivyignore"
          trivy fs --scanners vuln --timeout 10m --severity HIGH,CRITICAL --exit-code 1 \
            --config "$RUNNER_TEMP/security/trivy.yaml" \
            --ignorefile "$RUNNER_TEMP/security/empty.trivyignore" \
            --skip-dirs '**/.git,**/node_modules,**/deps,**/_build,**/target,**/dist,**/.sources,**/.venv' \
            --format json --output "$RUNNER_TEMP/security/dependencies.json" .
      - name: Retain redacted findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-security
          path: |
            ${{ runner.temp }}/security/secrets.json
            ${{ runner.temp }}/security/dependencies.json
          retention-days: 14
          if-no-files-found: ignore
